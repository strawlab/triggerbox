name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # At 23:25 on Thursday.
    - cron: "25 23 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-arduino-firmware:
    # Based on https://legion2.github.io/2020/03/27/from-arduino-builder-to-arduino-cli.html
    # and https://blog.arduino.cc/2019/11/14/arduino-on-github-actions/
    strategy:
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runs-on }}
    env:
      # setup-arduino-cli (even its latest release) targets the deprecated
      # Node.js 20. Run it on Node.js 24.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2.0.0
      - name: Install platform
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile Sketch
        run: arduino-cli compile --fqbn arduino:avr:nano

  # Lint, test and document the host library with the latest stable Rust.
  # Warnings are errors. The weekly scheduled run catches new lints in new Rust
  # releases.
  check:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: braid-triggerbox-rs
    steps:
      - uses: actions/checkout@v7
      - name: Install update apt repos
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
        if: matrix.runs-on == 'ubuntu-latest'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run fmt
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- --deny=warnings
      - name: Run test
        run: cargo test --workspace
      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: --deny=warnings

  # braid-triggerbox-comms is also used without `std` by the firmware.
  check-comms-no-std:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: braid-triggerbox-rs
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv6m-none-eabi
      - name: Run clippy
        run: >-
          cargo clippy -p braid-triggerbox-comms --no-default-features --features defmt
          --target thumbv6m-none-eabi -- --deny=warnings

  # Check that each crate builds with the `rust-version` it declares.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install update apt repos
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Check host crates
        working-directory: braid-triggerbox-rs
        run: cargo hack check --rust-version --workspace
      - name: Check firmware
        working-directory: hardware_v3/braid-triggerbox-firmware-pico
        run: |
          MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "$MSRV" --profile minimal --target thumbv6m-none-eabi --no-self-update
          cargo "+$MSRV" check --locked

  # Security advisories, licenses and dependency sources. See deny.toml.
  cargo-deny:
    strategy:
      matrix:
        manifest-path:
          - braid-triggerbox-rs/Cargo.toml
          - hardware_v3/braid-triggerbox-firmware-pico/Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest-path }}

  check-license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test that every .rs file starts with an SPDX license header
        run: |
          fail=0
          for f in $(git ls-files '*.rs'); do
            if ! head -n 1 "$f" | grep -qx '// SPDX-License-Identifier: MIT OR Apache-2.0'; then
              echo "missing SPDX license header: $f"
              fail=1
            fi
          done
          exit $fail

  build-pico-firmware:
    strategy:
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: hardware_v3/braid-triggerbox-firmware-pico
    steps:
      - uses: actions/checkout@v7
      - name: Install update apt repos
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
        if: matrix.runs-on == 'ubuntu-latest'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv6m-none-eabi
      - name: Install flip-link
        run: cargo install flip-link --locked
      - name: Install elf2uf2-rs
        if: matrix.runs-on == 'ubuntu-latest'
        run: cargo install --git https://github.com/strawlab/elf2uf2-rs
      - name: Run fmt
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --release --locked -- --deny=warnings
      - name: Build ELF
        run: cargo build --release --locked
      # The firmware is built on every OS to check that development works
      # there, but the UF2 is only made and uploaded once.
      - name: Make artifacts directory
        if: matrix.runs-on == 'ubuntu-latest'
        run: mkdir -p artifacts
      - name: Build UF2
        if: matrix.runs-on == 'ubuntu-latest'
        run: elf2uf2-rs target/thumbv6m-none-eabi/release/braid-triggerbox-firmware-pico artifacts/braid-triggerbox-firmware-pico.uf2
      - name: Create README.txt
        if: matrix.runs-on == 'ubuntu-latest'
        run: echo "Hold down the BOOTSEL button when you plug in your Pico. It will appear as a drive onto which you should drag the UF2 file." > artifacts/README.txt
      - name: Archive UF2 firmware file
        if: matrix.runs-on == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: braid-triggerbox-firmware-pico
          path: hardware_v3/braid-triggerbox-firmware-pico/artifacts/*
