[package]
name = "braid-triggerbox"
version = "0.4.2"
authors = ["Andrew Straw <strawman@astraw.com>"]
license = "MIT OR Apache-2.0"
description = "camera synchronization trigger box for Braid"
repository = "https://github.com/strawlab/triggerbox"
homepage = "https://github.com/strawlab/triggerbox/tree/main/braid-triggerbox-rs"
edition = "2024"
rust-version = "1.89"
keywords = ["braid", "camera", "trigger", "synchronization"]
categories = ["hardware-support", "science"]
# The workspace config files are not part of the package.
exclude = ["clippy.toml", "release-plz.toml"]

[lints]
workspace = true

[dependencies]
thiserror = "2"
anyhow = "1.0.104"
tokio = { version = "1.53", default-features = false, features = [
    "sync",
    "macros",
    "time",
    "io-util",
    "rt-multi-thread",
] }
tokio-serial = "5.5.0"
log = "0.4.34"
nalgebra = "0.35"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
] }
lstsq = "0.8.0"
crc = "3.4"

braid-triggerbox-comms = { version = "0.1", path = "braid-triggerbox-comms" }

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11.11"

[workspace]
members = ["braid-triggerbox-comms"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
# Panic on integer overflow in release builds too, rather than silently
# wrapping.
overflow-checks = true
