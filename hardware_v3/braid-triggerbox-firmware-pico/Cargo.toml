[package]
name = "braid-triggerbox-firmware-pico"
version = "0.1.0"
authors = ["Andrew Straw <strawman@astraw.com>"]
license = "MIT/Apache-2.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
static_assertions = "1.1.0"

cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
cortex-m-rtic = "1.1.4"
embedded-hal = "1.0.0"

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
usb-device = "0.3.2"
usbd-serial = "0.2.2"

crc = "3.4.0"

rp-pico = "0.9.0"

heapless = "0.9.1"
bbqueue = {version="0.5.1", features=["thumbv6"]}
fugit = { version = "0.3.9", features = ["defmt"] }

braid-triggerbox-comms = {path="../../braid-triggerbox-rs/braid-triggerbox-comms", default-features=false, features=["thumbv6", "defmt"]}
